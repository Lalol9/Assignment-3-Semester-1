<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/reset.css" />
    <link rel="stylesheet" href="./css/variables.css" />
    <link rel="stylesheet" href="./css/header.css" />
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/footer.css" />
    <title>Music Thingy</title>
  </head>
  <body>
    <header>
      <h1>Really cool music player!!!</h1>
      <nav>
        <a href="index.html">Home ;P</a>
      </nav>
      <div class="search">
        <input
          class="search-input"
          type="text"
          name="search-input"
          id="search-input"
        />
        <button class="search__button">Search!</button>
      </div>
    </header>
    <main>
      <aside class="sidebar"></aside>
      <div class="main-content">
        <div class="main-content__categories"></div>
        <div class="main-content__songs"></div>
      </div>
    </main>
    <footer>
      <div class="playback-controls">
        <div class="playback-controls__previous-song">previous song</div>
        <div class="playback-controls__play-pause">play/pause</div>
        <div class="playback-controls__next-song">next song</div>
        <div class="playback-controls__random">random</div>
        <div class="playback-controls__loop">loop</div>
      </div>
      <div class="footer-text">
        <h4 class="footer-text__header">Lorem ipsum dolor sit amet.</h4>
        <p class="footer-text__content">
          Lorem ipsum, dolor sit amet consectetur adipisicing elit. Nostrum quod
          dolorum enim consectetur quam tempora quas facere, nisi aliquam
          consequuntur.
        </p>
      </div>
    </footer>
  </body>
  <script src="./js/app.js"></script>
</html>
