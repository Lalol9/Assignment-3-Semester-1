<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/reset.css" />
    <link rel="stylesheet" href="./css/variables.css" />
    <link rel="stylesheet" href="./css/header.css" />
    <link rel="stylesheet" href="./css/sidebar.css" />
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/footer.css" />
    <title>Playlist Maker</title>
  </head>
  <body>
    <header>
      <h1>Playlist Maker</h1>
      <!-- <nav>
        <a href="index.html">Home ;P</a>
      </nav> -->
      <!-- Filter -->
      <div class="header__filter">
        <label for="header__filter__select" class="header__filter__label"
          >Show</label
        >
        <select
          name="header__filter__select"
          id="header__filter__select"
          class="header__filter__select genre-filter"
        >
          <option value="all">All Genres</option>
          <option value="Rock">Rock</option>
          <option value="Metal">Metal</option>
          <option value="Electronic">Electronic</option>
          <option value="Pop">Pop</option>
          <option value="Jazz">Jazz</option>
        </select>
      </div>
      <!-- Search -->
      <div class="search">
        <input
          class="search__input"
          type="text"
          name="search-input"
          id="search-input"
          placeholder="Search for a song!"
        />
        <button class="search__button">Search!</button>
      </div>
    </header>
    <main>
      <aside class="sidebar">
        <div class="sidebar__formating-div"></div>
        <p class="sidebar__all-songs playlist-button">All Songs</p>
        <div class="sidebar__my-playlist">
          <p class="sidebar__my-playlist__button playlist-button">
            My Playlist
          </p>
          <div class="sidebar__my-playlist__stats-container">
            <p class="sidebar__my-playlist__length">Songs : 12</p>
            <div class="sidebar__my-playlist__duration">
              <p class="sidebar__my-playlist__duration-text">Duration:</p>
              <p class="sidebar__my-playlist__duration-time">14min</p>
            </div>
          </div>
        </div>
        <ul class="sidebar__user-playlists"></ul>
      </aside>
      <div class="main-content">
        <div class="main-content__categories">
          <div class="category category-title">Title</div>
          <div class="category category-artist">Artist</div>
          <div class="category category-genre">Genre</div>
          <div class="category category-duration">Duration</div>
        </div>
        <ul class="main-content__song-list"></ul>
        <li class="footer-compensation"></li>
      </div>
    </main>
    <footer>
      <!-- Playback controls ----------------------------------- -->
      <div class="playback-controls">
        <div class="playback-controls__random playback-button">
          <img
            class="playback-controls__icon"
            src="./assets/icons/shuffle.svg"
            alt="Shuffle"
          />
        </div>
        <div class="playback-controls__loop playback-button">
          <img
            class="playback-controls__icon"
            src="./assets/icons/repeat.svg"
            alt="Repeat"
          />
        </div>
        <div class="playback-controls__previous-song playback-button">
          <img
            class="playback-controls__icon"
            src="./assets/icons/skip_previous.svg"
            alt="Previous"
          />
        </div>
        <div class="playback-controls__play-pause playback-button">
          <img
            class="playback-controls__icon play-pause-icon"
            src="./assets/icons/play_arrow.svg"
            alt="Play/Pause"
          />
        </div>
        <div class="playback-controls__next-song playback-button">
          <img
            class="playback-controls__icon"
            src="./assets/icons/skip_next.svg"
            alt="Next"
          />
        </div>
      </div>
      <!-- Song and artist -------------------------------------- -->
      <div class="footer__song-and-artist">
        <p class="footer__song-title"></p>
        <p class="footer__song-and-artist-separator"></p>
        <p class="footer__song-artist"></p>
      </div>
      <!-- footer text ------------------------------------------ -->
      <div class="footer-text">
        <h4 class="footer-text__heading">This is a student project.</h4>
        <p class="footer-text__content">
          This website is affiliated with none of the listed artist and plays no
          music!
        </p>
      </div>
      <!-- Message box -->
      <div class="footer__messagebox messagebox-inactive">
        <p class="footer__messagebox-text"></p>
      </div>
    </footer>
  </body>
  <script src="./data/songs.js"></script>
  <script src="./js/app.js"></script>
</html>
